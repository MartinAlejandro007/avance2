spring.application.name=intercampus

# Base de datos H2 persistida en el archivo ./data/intercampus.mv.db
spring.datasource.url=jdbc:h2:file:./data/intercampus
spring.datasource.username=sa
spring.datasource.password=

# Hibernate actualiza el esquema segun las entidades durante desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Rastreo de demostración: coordenadas y velocidad simuladas, sin GPS real.
tracker.enabled=true
tracker.interval-ms=3000
tracker.speed-kmh=28
tracker.dwell-seconds=12
tracker.stop-meters=40
tracker.near-meters=300
tracker.fallback-speed-kmh=20
tracker.speed-factor=0.85
tracker.fence-meters=150
tracker.stopped-seconds=60

reports.punctuality-tolerance-minutes=2
