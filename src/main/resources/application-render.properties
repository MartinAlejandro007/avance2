# Despliegue de demostración: el puerto lo asigna Render.
server.address=0.0.0.0
server.port=${PORT:8080}

# En el plan gratuito, este archivo se pierde al reiniciar o suspender el servicio.
# Un disco persistente admite una URL JDBC absoluta mediante esta variable.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/intercampus}
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
